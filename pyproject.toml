[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silentdoubt"
version = "0.1.0"
description = "Callable, resumable harness for the silent-states v3.0 bank on gemma-2-9b-it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Model internals, hooking, generation and tokenization are NOT reimplemented here:
# nnsight owns the tracing/capture surface, transformers owns the model + chat template,
# scikit-learn owns the probe fitting. This package only supplies the bank contract,
# the turn loop, the label logic and the presentation layer.
dependencies = [
  "nnsight>=0.4,<0.5",
  "torch>=2.4",
  "transformers>=4.44",
  "accelerate>=0.30",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
silentdoubt = "silentdoubt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/silentdoubt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
