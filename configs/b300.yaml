# Production run: google/gemma-2-9b-it on one B300, 4h wall clock.
#
# Everything pre-registered lives in the bank; this file holds only the
# operational decisions the bank deliberately leaves open.

run_id: b300
seed: 20250817
runs_dir: runs

data:
  bank: data/silent_states_bank.json
  extension: data/algorithmic_worlds_v1.json
  # Locked decision: the algorithmic worlds run these four cells only, and never
  # enter probe training. Adding EXC/CON here is the one change needed to make a
  # heldout-engagement tier runnable.
  heldout_cells: [TED, FUT, MASK, GRIND]

model:
  name: google/gemma-2-9b-it
  torch_dtype: bfloat16
  # Gemma-2 soft-caps both attention and final logits; eager is the implementation
  # that honours attention soft-capping. Switch to sdpa only after a 3-prompt
  # logit-equivalence check.
  attn_implementation: eager
  device_map: auto
  reply_max_new_tokens: 512
  prefill_max_new_tokens: 64
  temperature: 0.0 # greedy for every canonical trajectory
  generate_batch: 32 # generation dominates wall clock
  measure_batch: 64 # battery forks are single forward passes
  capture_batch: 8 # capture holds a full ctx+reply sequence at every layer

budget:
  enabled: true
  wall_clock_hours: 4.0
  reserve_minutes: 40 # buffer for re-runs and the report review

gates:
  enabled: true
  drop_failing_heldout: true
  halt_on_verified_failure: true # a pre-registered world failing is a finding

capture:
  views: [pre_reply, reply_mean, reply_last]
  fresh_instances: true # probe_plan's "fresh version" directions

battery:
  sr_doubt_b_fraction: 0.25 # paraphrase-robustness subset (elicitation._doc)

probes:
  n_permutations: 100
  C: 1.0
  max_iter: 2000
  layer_stride: 1 # sweep every layer
  views: [pre_reply, reply_mean, reply_last]
  random_state: 0

judge:
  enabled: true
  model: claude-opus-5
  max_concurrency: 8
  manual_review_samples: 30

# Tiers run in order; the budget guard drops from the tail and logs every drop.
tiers:
  - name: P0
    split: train
    cells: [EXC, TED, CON, FUT, GRIND, MASK, T_REVEAL, T_REVEAL_HI]

  # The three remaining verified cells plus the heldout worlds, which ride here.
  # Cells already run under P0 are deduplicated by uid, so listing them only
  # brings in the heldout instantiations.
  - name: P1
    cells: [T_SPARK, T_CLARIFY, GASLIGHT, TED, FUT, MASK, GRIND]

  # Sampled replicates of the three cells the headline claim rests on.
  - name: P2
    split: train
    cells: [MASK, FUT, T_REVEAL_HI]
    seeds: 2
    temperature: 0.7
